name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'kivy_app/docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip \
            openjdk-17-jdk unzip zip \
            autoconf automake libtool \
            libffi-dev libssl-dev \
            zlib1g-dev libbz2-dev \
            libncurses5-dev libncursesw5-dev \
            libreadline-dev libsqlite3-dev \
            cmake

      - name: Set JAVA_HOME to JDK 17
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Copy data files to kivy_app
        run: |
          cp iching_data.py kivy_app/
          cp yaoci_data.py kivy_app/

      - name: Pre-flight Check (璐ㄦ鍗″叧)
        working-directory: kivy_app
        run: |
          echo "Running pre-flight checks before build..."
          python preflight_check.py
          echo "Pre-flight check passed!"

      - name: Clean previous build
        working-directory: kivy_app
        run: |
          rm -rf .buildozer bin
          echo "Cleaned .buildozer and bin directories"

      - name: Build APK
        working-directory: kivy_app
        env:
          KIVY_LOG_MODE: PYTHON
        run: |
          buildozer -v android debug

      - name: Verify APK version
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f -exec ls -la {} \;
          echo "=== Expected version: 10.8.0 ==="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianJi-APK-v10.8.0
          path: kivy_app/bin/*.apk
          retention-days: 30
          if-no-files-found: error
