name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip \
            openjdk-17-jdk unzip zip \
            autoconf automake libtool \
            libffi-dev libssl-dev \
            zlib1g-dev libbz2-dev \
            libncurses5-dev libncursesw5-dev \
            libreadline-dev libsqlite3-dev \
            cmake

      - name: Set JAVA_HOME to JDK 17
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Copy data files to kivy_app
        run: |
          cp iching_data.py kivy_app/
          cp yaoci_data.py kivy_app/

      - name: Build APK
        working-directory: kivy_app
        env:
          KIVY_LOG_MODE: PYTHON
        run: |
          buildozer -v android debug

      - name: List bin directory
        run: |
          echo "=== kivy_app/bin contents ==="
          ls -la kivy_app/bin/ || echo "bin directory not found"
          echo "=== searching for APK ==="
          find . -name "*.apk" -type f || echo "no APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianJi-APK-v10.5
          path: kivy_app/bin/*.apk
          retention-days: 30
          if-no-files-found: error
